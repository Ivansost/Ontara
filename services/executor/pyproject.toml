[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ontara-executor"
version = "0.1.0"
description = "Authenticated browser tools and cloud process supervisor for Ontara"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.7",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.14.3",
  "playwright==1.65.2",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
